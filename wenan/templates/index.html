<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 文案提取</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; background:#f5f6f8;
           margin:0; padding:40px 16px; color:#222; }
    .box { max-width:760px; margin:0 auto; background:#fff; border-radius:14px;
           padding:28px 28px 32px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:#888; font-size:13px; margin-bottom:22px; }
    input[type=text] { width:100%; box-sizing:border-box; padding:13px 14px;
           font-size:15px; border:1px solid #d6d9de; border-radius:9px; }
    button.primary { margin-top:14px; width:100%; padding:13px; font-size:16px; border:none;
           border-radius:9px; background:#2563eb; color:#fff; cursor:pointer; }
    button.primary:disabled { background:#9bb4ee; cursor:not-allowed; }
    #status { margin-top:18px; font-size:14px; white-space:pre-wrap; line-height:1.6; }
    .err { color:#c0392b; }
    .ok  { color:#137333; }
    .card { margin-top:18px; border:1px solid #e6e8eb; border-radius:10px; padding:16px;
            background:#fafbfc; display:none; }
    .meta { font-size:13px; color:#555; margin-bottom:12px; }
    .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .act { padding:10px 14px; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
    .act.copy { background:#137333; color:#fff; }
    .act.copy2 { background:#0b66c3; color:#fff; }
    .act.dl { background:#eef1f4; color:#222; text-decoration:none; display:inline-block; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.6;
          max-height:320px; overflow:auto; background:#fff; padding:12px; border-radius:8px;
          border:1px solid #eee; margin:0; }
    .tip { font-size:12px; color:#888; margin:8px 0 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎬 YouTube 文案提取</h1>
    <div class="sub">粘贴视频链接 → 点按钮 → 抓出文字稿（优先中文，其次英文）。整理交给你自己的 Claude / GPT。</div>

    <input type="text" id="url" placeholder="在这里粘贴 YouTube 视频链接，例如 https://www.youtube.com/watch?v=...">
    <button class="primary" id="go" onclick="run()">提取文案（有字幕用这个）</button>
    <button class="primary" id="goAudio" onclick="runAudio()" style="background:#0b8043; margin-top:8px;">⬇️ 下载音频（没字幕用这个，喂给 Whisper 转文字）</button>

    <div id="status"></div>

    <div class="card" id="audioCard" style="display:none;">
      <div class="meta" id="audioMeta"></div>
      <a class="act dl" id="audioDl" href="#" style="background:#0b8043;color:#fff;">⬇️ 下载这个音频文件</a>
      <div class="tip">音频也已存到 outputs 文件夹。把它拖进你的 Whisper 软件（选简体中文）就能转成文字。</div>
    </div>

    <div class="card" id="card">
      <div class="meta" id="meta"></div>
      <div class="btnrow">
        <button class="act copy2" id="copyPack" onclick="copyText('pack', this)">📋 复制（整理指令＋文字稿）</button>
        <button class="act copy" id="copyRaw" onclick="copyText('raw', this)">📄 只复制文字稿</button>
        <a class="act dl" id="dl" href="#">⬇️ 下载 txt</a>
      </div>
      <div class="tip">把「整理指令＋文字稿」粘到你的 Claude 或 ChatGPT 对话框，发送，整理好的文案就出来了。</div>
      <div style="font-size:13px;color:#555;margin:14px 0 6px;">文字稿预览：</div>
      <pre id="preview"></pre>
    </div>
  </div>

<script>
let LAST = { raw: "", pack: "" };

async function run() {
  const url = document.getElementById('url').value.trim();
  const status = document.getElementById('status');
  const card = document.getElementById('card');
  const btn = document.getElementById('go');
  card.style.display = 'none';
  if (!url) { status.className='err'; status.textContent='请先粘贴一个链接。'; return; }

  btn.disabled = true;
  status.className = '';
  status.textContent = '正在抓取文字稿，请稍等（第一次可能慢一点）…';

  try {
    const res = await fetch('/extract', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();

    if (data.ok) {
      status.className='ok';
      status.textContent='✅ 抓取成功！txt 也已存到 outputs 文件夹。';
      document.getElementById('meta').innerHTML =
        `标题：${data.title || '(未知)'}　|　字幕语言：${data.lang}　|　共 ${data.chars} 字`;
      LAST.raw = data.raw_text || "";
      LAST.pack = data.paste || "";
      document.getElementById('dl').href = '/download/' + encodeURIComponent(data.raw_name);
      document.getElementById('preview').textContent = data.preview +
        (data.chars > 1500 ? '\n\n…（这里只是预览，完整内容请复制或下载）' : '');
      card.style.display = 'block';
    } else {
      status.className='err';
      status.textContent = '⚠️ ' + data.msg;
    }
  } catch (e) {
    status.className='err';
    status.textContent = '出错了：' + e + '\n（请确认这个窗口对应的程序还在运行）';
  } finally {
    btn.disabled = false;
  }
}

async function runAudio() {
  const url = document.getElementById('url').value.trim();
  const status = document.getElementById('status');
  const card = document.getElementById('card');
  const aCard = document.getElementById('audioCard');
  const btn = document.getElementById('goAudio');
  card.style.display = 'none';
  aCard.style.display = 'none';
  if (!url) { status.className='err'; status.textContent='请先粘贴一个链接。'; return; }

  btn.disabled = true;
  status.className = '';
  status.textContent = '正在下载音频，请稍等（按视频长短，可能要十几秒到一两分钟）…';

  try {
    const res = await fetch('/extract_audio', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if (data.ok) {
      status.className='ok';
      status.textContent='✅ 音频下载成功！';
      document.getElementById('audioMeta').textContent = '标题：' + (data.title || '(未知)');
      document.getElementById('audioDl').href = '/download/' + encodeURIComponent(data.audio_name);
      aCard.style.display = 'block';
    } else {
      status.className='err';
      status.textContent = '⚠️ ' + data.msg;
    }
  } catch (e) {
    status.className='err';
    status.textContent = '出错了：' + e + '\n（请确认这个窗口对应的程序还在运行）';
  } finally {
    btn.disabled = false;
  }
}

async function copyText(which, el) {
  const text = which === 'pack' ? LAST.pack : LAST.raw;
  if (!text) return;
  const old = el.textContent;
  try {
    await navigator.clipboard.writeText(text);
    el.textContent = '✅ 已复制';
  } catch (e) {
    // 退一步：用老办法复制
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    el.textContent = '✅ 已复制';
  }
  setTimeout(() => { el.textContent = old; }, 1500);
}
</script>
</body>
</html>
