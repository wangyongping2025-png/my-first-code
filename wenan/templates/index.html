<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 文案提取</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; background:#f5f6f8;
           margin:0; padding:40px 16px; color:#222; }
    .box { max-width:760px; margin:0 auto; background:#fff; border-radius:14px;
           padding:28px 28px 32px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:#888; font-size:13px; margin-bottom:22px; }
    input[type=text] { width:100%; box-sizing:border-box; padding:13px 14px;
           font-size:15px; border:1px solid #d6d9de; border-radius:9px; }
    button { margin-top:14px; width:100%; padding:13px; font-size:16px; border:none;
           border-radius:9px; background:#2563eb; color:#fff; cursor:pointer; }
    button:disabled { background:#9bb4ee; cursor:not-allowed; }
    #status { margin-top:18px; font-size:14px; white-space:pre-wrap; line-height:1.6; }
    .err { color:#c0392b; }
    .ok  { color:#137333; }
    .card { margin-top:18px; border:1px solid #e6e8eb; border-radius:10px; padding:16px;
            background:#fafbfc; display:none; }
    .meta { font-size:13px; color:#555; margin-bottom:10px; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.6;
          max-height:320px; overflow:auto; background:#fff; padding:12px; border-radius:8px;
          border:1px solid #eee; margin:0; }
    a.dl { display:inline-block; margin-top:12px; padding:10px 16px; background:#137333;
           color:#fff; text-decoration:none; border-radius:8px; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎬 YouTube 文案提取</h1>
    <div class="sub">粘贴视频链接 → 点按钮 → 得到文字稿（优先中文，其次英文）</div>

    <input type="text" id="url" placeholder="在这里粘贴 YouTube 视频链接，例如 https://www.youtube.com/watch?v=...">
    <button id="go" onclick="run()">提取文案</button>

    <div id="status"></div>

    <div class="card" id="card">
      <div class="meta" id="meta"></div>
      <div id="downloads" style="margin-bottom:12px;"></div>
      <div style="font-size:13px;color:#555;margin-bottom:6px;">整理后预览：</div>
      <pre id="preview"></pre>
    </div>
  </div>

<script>
async function run() {
  const url = document.getElementById('url').value.trim();
  const status = document.getElementById('status');
  const card = document.getElementById('card');
  const btn = document.getElementById('go');
  card.style.display = 'none';
  if (!url) { status.className='err'; status.textContent='请先粘贴一个链接。'; return; }

  btn.disabled = true;
  status.className = '';
  status.textContent = '正在抓字幕 + AI 整理，请稍等（整理可能要十几秒到一分钟）…';

  try {
    const res = await fetch('/extract', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();

    if (data.ok) {
      status.className='ok';
      status.textContent='✅ 提取并整理完成！文件也已存到 outputs 文件夹。';
      document.getElementById('meta').innerHTML =
        `标题：${data.title || '(未知)'}　|　字幕语言：${data.lang}<br>` +
        `原文 ${data.raw_chars} 字　→　整理后 ${data.md_chars} 字　|　内容保留约 ${data.ratio}%`;
      const dl = (name, label) =>
        `<a class="dl" style="margin-right:8px" href="/download/${encodeURIComponent(name)}">${label}</a>`;
      document.getElementById('downloads').innerHTML =
        dl(data.md_name, '⬇️ 整理后 Markdown') +
        dl(data.raw_name, '⬇️ 原始 txt') +
        dl(data.log_name, '⬇️ 处理记录');
      document.getElementById('preview').textContent = data.preview +
        (data.md_chars > 1800 ? '\n\n…（仅预览，完整内容请下载文件）' : '');
      card.style.display = 'block';
    } else {
      status.className='err';
      status.textContent = '⚠️ ' + data.msg;
    }
  } catch (e) {
    status.className='err';
    status.textContent = '出错了：' + e + '\n（请确认这个窗口对应的程序还在运行）';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
